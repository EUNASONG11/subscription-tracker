<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구독 명세서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE1;
    --surface:#FBFAF6;
    --surface-raised:#FFFFFF;
    --ink:#232420;
    --ink-soft:#6B6A5F;
    --ink-faint:#A6A395;
    --accent:#2F6F4F;
    --accent-ink:#F4FAF6;
    --accent-soft:#E4EEE7;
    --danger:#B23A2E;
    --danger-soft:#F5E3DF;
    --line:#D8D4C8;
    --shadow:rgba(35,36,32,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#161713;
      --surface:#1F1F1A;
      --surface-raised:#272620;
      --ink:#EEEBE2;
      --ink-soft:#9C9A8C;
      --ink-faint:#67655A;
      --accent:#5FAE86;
      --accent-ink:#12231A;
      --accent-soft:#233229;
      --danger:#E0876F;
      --danger-soft:#3A2620;
      --line:#37362E;
      --shadow:rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#161713;
    --surface:#1F1F1A;
    --surface-raised:#272620;
    --ink:#EEEBE2;
    --ink-soft:#9C9A8C;
    --ink-faint:#67655A;
    --accent:#5FAE86;
    --accent-ink:#12231A;
    --accent-soft:#233229;
    --danger:#E0876F;
    --danger-soft:#3A2620;
    --line:#37362E;
    --shadow:rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  [hidden]{ display:none !important; }
  .num{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }

  .frame{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    background:var(--surface);
    box-shadow:0 0 60px var(--shadow);
    display:flex;
    flex-direction:column;
  }

  header.top{
    padding:28px 20px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-faint);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .theme-toggle{
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.08em;
    padding:4px 8px;
    border-radius:20px;
    cursor:pointer;
  }
  h1.title{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:22px;
    margin:6px 0 20px;
    text-wrap:balance;
  }
  .total-block{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .total-figure{ font-size:38px; font-weight:600; letter-spacing:-0.01em; }
  .total-unit{ font-size:15px; color:var(--ink-soft); }
  .total-caption{ margin-top:4px; font-size:13px; color:var(--ink-soft); }
  .total-caption b{ color:var(--ink); font-weight:600; }
  .total-caption.error{ color:var(--danger); }

  .card-strip{
    display:flex; gap:8px; overflow-x:auto;
    padding:16px 20px 4px;
    scrollbar-width:none;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    cursor:grab;
    touch-action:pan-x;
  }
  .card-strip.dragging{ cursor:grabbing; scroll-snap-type:none; }
  .card-strip::-webkit-scrollbar{ display:none; }
  .card-chip{
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 12px 6px 8px;
    font-size:12px;
    white-space:nowrap;
    scroll-snap-align:start;
  }
  .card-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .card-chip .amt{ color:var(--ink-soft); }

  .card-dots{ display:flex; gap:5px; justify-content:center; align-items:center; padding:6px 0 2px; }
  .card-dots i{ width:5px; height:5px; border-radius:50%; background:var(--line); display:block; font-style:normal; transition:width .15s, background-color .15s; }
  .card-dots i.active{ width:14px; border-radius:4px; background:var(--accent); }

  main{ flex:1; padding:10px 20px 32px; }
  .section-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-faint);
    margin:18px 2px 8px;
    display:flex; justify-content:space-between; align-items:center;
  }

  .view-switch{
    display:flex; gap:6px; margin-top:16px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:12px; padding:3px;
  }
  .view-btn{
    flex:1; border:none; background:transparent; color:var(--ink-soft);
    font-family:'Public Sans', sans-serif; font-size:13px; font-weight:600;
    padding:8px 0; border-radius:9px; cursor:pointer;
  }
  .view-btn.active{ background:var(--surface-raised); color:var(--ink); box-shadow:0 1px 3px var(--shadow); }

  .list{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding:14px 2px;
    border-bottom:1px dashed var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .row-dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; margin-top:2px; align-self:flex-start; }
  .row-body{ flex:1; min-width:0; }
  .row-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .row-name{ font-size:15px; font-weight:600; }
  .row-amount{ font-size:15px; font-weight:600; white-space:nowrap; }
  .row-meta{ display:flex; gap:8px; align-items:center; margin-top:3px; flex-wrap:wrap; }
  .row-sub{ font-size:12px; color:var(--ink-soft); }
  .dday{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; font-weight:600;
    padding:2px 7px; border-radius:20px;
    background:var(--accent-soft); color:var(--accent);
    letter-spacing:.02em;
  }
  .dday.soon{ background:var(--danger-soft); color:var(--danger); }
  .row-card{ font-size:11px; color:var(--ink-faint); }

  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin:16px 2px 10px; }
  .cal-nav-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-raised); color:var(--ink-soft); font-size:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cal-month-label{ font-family:'Fraunces', Georgia, serif; font-weight:600; font-size:16px; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px; }
  .cal-weekdays span{
    text-align:center; font-size:10.5px; color:var(--ink-faint);
    font-family:'IBM Plex Mono', monospace; padding:2px 0 6px;
  }
  .cal-weekdays span.sun{ color:var(--danger); opacity:.75; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell{
    aspect-ratio:1/1; border-radius:10px; border:1px solid transparent;
    background:transparent; color:inherit; cursor:pointer; padding:5px 2px 3px;
    display:flex; flex-direction:column; align-items:center; font-family:inherit;
  }
  .cal-cell.empty{ visibility:hidden; cursor:default; }
  .cal-daynum{ font-size:11.5px; color:var(--ink); font-family:'IBM Plex Mono', monospace; }
  .cal-cell.today .cal-daynum{
    background:var(--accent); color:var(--accent-ink);
    width:19px; height:19px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-cell.selected{ border-color:var(--accent); background:var(--accent-soft); }
  .cal-dots{ display:flex; gap:2px; margin-top:4px; flex-wrap:wrap; justify-content:center; max-width:36px; }
  .cal-dots i{ width:5px; height:5px; border-radius:50%; display:block; font-style:normal; }
  .cal-more{ font-size:8px; color:var(--ink-faint); font-family:'IBM Plex Mono', monospace; }
  .cal-detail-hint{ font-size:12.5px; color:var(--ink-faint); text-align:center; padding:20px 10px; }

  .empty-cta{
    margin-top:14px;
    border:1px dashed var(--line);
    border-radius:14px;
    padding:20px 16px;
    text-align:center;
    font-size:13px; color:var(--ink-soft); line-height:1.5;
  }

  .data-note{
    margin-top:28px; padding-top:14px;
    border-top:1px solid var(--line);
    font-size:11.5px; color:var(--ink-faint); text-align:center; line-height:1.6;
  }
  .data-note a{ color:var(--accent); font-weight:600; }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="frame">
  <header class="top">
    <div class="eyebrow">
      <span>SUBSCRIPTION STATEMENT</span>
      <button class="theme-toggle" id="themeToggle" type="button">라이트/다크</button>
    </div>
    <h1 class="title">구독 명세서</h1>
    <div class="total-block">
      <span class="total-figure num" id="totalFigure">0</span>
      <span class="total-unit">원 / 월평균</span>
    </div>
    <div class="total-caption" id="totalCaption">구독 목록을 불러오는 중...</div>
  </header>

  <div class="card-strip" id="cardStrip"></div>
  <div class="card-dots" id="cardDots"></div>

  <main>
    <div class="view-switch" id="viewSwitch">
      <button class="view-btn active" type="button" data-view="list">리스트</button>
      <button class="view-btn" type="button" data-view="calendar">캘린더</button>
    </div>

    <div id="listView">
      <div class="section-label">
        <span>결제 예정순</span>
        <span id="countLabel"></span>
      </div>
      <div class="list" id="list"></div>
    </div>

    <div id="calendarView" hidden>
      <div class="cal-header">
        <button class="cal-nav-btn" id="calPrev" type="button" aria-label="이전 달">‹</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="cal-nav-btn" id="calNext" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="cal-weekdays">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="section-label" id="calDetailLabel" style="margin-top:18px;"></div>
      <div class="list" id="calDetailList"></div>
    </div>

    <p class="data-note">
      목록은 GitHub 저장소의 data.js에서 고쳐요.<br>
      <a href="https://github.com/EUNASONG11/subscription-tracker/edit/main/data.js">data.js 수정하기</a>
    </p>
  </main>
</div>

<script>
(function(){
  "use strict";

  var CARD_COLORS = ["#3B5BA5","#B2452F","#5A7247","#8B5A9E","#C08A2E","#3C8C8C","#A24B72","#4A5568"];
  var MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

  function colorForCard(name){
    var h = 0;
    for (var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    return CARD_COLORS[h % CARD_COLORS.length];
  }

  function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function daysInMonth(year, monthIndex0){ return new Date(year, monthIndex0+1, 0).getDate(); }

  function nextOccurrence(sub, from){
    var today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
    if (sub.cycle === 'yearly'){
      var y = today.getFullYear();
      var mo = sub.billingMonth - 1;
      var d = Math.min(sub.billingDay, daysInMonth(y, mo));
      var candidate = new Date(y, mo, d);
      if (candidate < today){
        y += 1;
        d = Math.min(sub.billingDay, daysInMonth(y, mo));
        candidate = new Date(y, mo, d);
      }
      return candidate;
    }
    var y2 = today.getFullYear(), m2 = today.getMonth();
    var d2 = Math.min(sub.billingDay, daysInMonth(y2, m2));
    var cand = new Date(y2, m2, d2);
    if (cand < today){
      m2 += 1;
      if (m2 > 11){ m2 = 0; y2 += 1; }
      d2 = Math.min(sub.billingDay, daysInMonth(y2, m2));
      cand = new Date(y2, m2, d2);
    }
    return cand;
  }

  function monthlyAmount(sub){
    return sub.cycle === 'yearly' ? sub.amount / 12 : sub.amount;
  }

  function ddayLabel(next, today){
    var t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var diff = Math.round((next - t0) / 86400000);
    if (diff === 0) return 'D-DAY';
    return 'D-' + diff;
  }

  var subs = [];

  var els = {
    totalFigure: document.getElementById('totalFigure'),
    totalCaption: document.getElementById('totalCaption'),
    cardStrip: document.getElementById('cardStrip'),
    cardDots: document.getElementById('cardDots'),
    list: document.getElementById('list'),
    countLabel: document.getElementById('countLabel'),
    themeToggle: document.getElementById('themeToggle'),
    viewSwitch: document.getElementById('viewSwitch'),
    listView: document.getElementById('listView'),
    calendarView: document.getElementById('calendarView'),
    calPrev: document.getElementById('calPrev'),
    calNext: document.getElementById('calNext'),
    calMonthLabel: document.getElementById('calMonthLabel'),
    calGrid: document.getElementById('calGrid'),
    calDetailLabel: document.getElementById('calDetailLabel'),
    calDetailList: document.getElementById('calDetailList')
  };

  function normalize(raw){
    return raw.map(function(s){
      var yearly = s.cycle === 'yearly';
      var card = String(s.card || '');
      return {
        name: String(s.name || ''),
        amount: Number(s.amount) || 0,
        cycle: yearly ? 'yearly' : 'monthly',
        billingDay: Math.min(Math.max(Number(s.day) || 1, 1), 31),
        billingMonth: yearly ? Math.min(Math.max(Number(s.month) || 1, 1), 12) : null,
        card: card,
        color: colorForCard(card)
      };
    });
  }

  function render(){
    var today = new Date();
    var list = subs.slice();
    list.forEach(function(s){ s.__next = nextOccurrence(s, today); });
    list.sort(function(a,b){ return a.__next - b.__next; });

    var monthlyTotal = subs.reduce(function(acc,s){ return acc + monthlyAmount(s); }, 0);
    els.totalFigure.textContent = fmt(monthlyTotal);

    var thisMonthDue = subs.filter(function(s){
      return s.__next.getMonth() === today.getMonth() && s.__next.getFullYear() === today.getFullYear();
    });
    var thisMonthSum = thisMonthDue.reduce(function(acc,s){ return acc + s.amount; }, 0);
    els.totalCaption.className = 'total-caption';
    els.totalCaption.innerHTML = '이번 달 남은 결제 <b>' + thisMonthDue.length + '건</b> · <b>' + fmt(thisMonthSum) + '원</b>';

    els.countLabel.textContent = list.length ? list.length + '건' : '';

    var byCard = {};
    subs.forEach(function(s){
      byCard[s.card] = byCard[s.card] || {total:0, color:s.color};
      byCard[s.card].total += monthlyAmount(s);
    });
    els.cardStrip.innerHTML = '';
    els.cardDots.innerHTML = '';
    var cardNames = Object.keys(byCard).sort(function(a,b){ return byCard[b].total - byCard[a].total; });
    cardNames.forEach(function(card, i){
      var chip = document.createElement('div');
      chip.className = 'card-chip';
      chip.innerHTML = '<span class="card-dot" style="background:' + byCard[card].color + '"></span>' +
        '<span>' + escapeHtml(card) + '</span>' +
        '<span class="amt num">' + fmt(byCard[card].total) + '원</span>';
      els.cardStrip.appendChild(chip);
      if (cardNames.length > 1){
        var dot = document.createElement('i');
        if (i === 0) dot.classList.add('active');
        els.cardDots.appendChild(dot);
      }
    });

    els.list.innerHTML = '';
    if (!list.length){
      els.list.innerHTML = '<div class="empty-cta">등록된 구독이 없어요.<br>data.js에 추가하면 여기에 나타나요.</div>';
    } else {
      list.forEach(function(s){ els.list.appendChild(buildRow(s, today)); });
    }

    renderCalendar();
  }

  function buildRow(s, today, overrideNext){
    var row = document.createElement('div');
    row.className = 'row';
    var next = overrideNext || s.__next;
    var soon = (next - today) / 86400000 <= 3;
    var cycleText = s.cycle === 'yearly'
      ? '매년 ' + MONTH_NAMES[s.billingMonth-1] + ' ' + s.billingDay + '일'
      : '매월 ' + s.billingDay + '일';
    row.innerHTML =
      '<span class="row-dot" style="background:' + s.color + '"></span>' +
      '<span class="row-body">' +
        '<span class="row-top">' +
          '<span class="row-name">' + escapeHtml(s.name) + '</span>' +
          '<span class="row-amount num">' + fmt(s.amount) + '원</span>' +
        '</span>' +
        '<span class="row-meta">' +
          '<span class="dday' + (soon ? ' soon' : '') + '">' + ddayLabel(next, today) + '</span>' +
          '<span class="row-sub">' + cycleText + '</span>' +
          '<span class="row-card">· ' + escapeHtml(s.card) + '</span>' +
        '</span>' +
      '</span>';
    return row;
  }

  // ---- calendar view ----
  var calDate = new Date(); calDate.setDate(1);
  var selectedDay = new Date();

  function occurrencesForMonth(year, monthIndex0){
    var map = {};
    subs.forEach(function(s){
      if (s.cycle === 'yearly' && s.billingMonth - 1 !== monthIndex0) return;
      var day = Math.min(s.billingDay, daysInMonth(year, monthIndex0));
      map[day] = map[day] || [];
      map[day].push(s);
    });
    return map;
  }

  function sameDate(a,b){
    return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  function renderCalendar(){
    var today = new Date();
    var year = calDate.getFullYear(), month = calDate.getMonth();
    els.calMonthLabel.textContent = year + '년 ' + MONTH_NAMES[month];

    var map = occurrencesForMonth(year, month);
    var firstWeekday = new Date(year, month, 1).getDay();
    var total = daysInMonth(year, month);

    els.calGrid.innerHTML = '';
    for (var i=0; i<firstWeekday; i++){
      var blank = document.createElement('div');
      blank.className = 'cal-cell empty';
      els.calGrid.appendChild(blank);
    }
    for (var day=1; day<=total; day++){
      var cellDate = new Date(year, month, day);
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'cal-cell';
      if (sameDate(cellDate, today)) cell.classList.add('today');
      if (sameDate(cellDate, selectedDay)) cell.classList.add('selected');

      var dotsHtml = '';
      var occ = map[day];
      if (occ && occ.length){
        dotsHtml = '<span class="cal-dots">' + occ.slice(0,3).map(function(s){
          return '<i style="background:' + s.color + '"></i>';
        }).join('') + '</span>';
        if (occ.length > 3){ dotsHtml += '<span class="cal-more">+' + (occ.length-3) + '</span>'; }
      }
      cell.innerHTML = '<span class="cal-daynum">' + day + '</span>' + dotsHtml;
      cell.addEventListener('click', function(d){
        return function(){ selectedDay = d; renderCalendar(); };
      }(cellDate));
      els.calGrid.appendChild(cell);
    }

    renderCalDetail(map);
  }

  function renderCalDetail(map){
    var today = new Date();
    els.calDetailList.innerHTML = '';
    if (selectedDay.getMonth() !== calDate.getMonth() || selectedDay.getFullYear() !== calDate.getFullYear()){
      els.calDetailLabel.textContent = '';
      els.calDetailList.innerHTML = '<div class="cal-detail-hint">날짜를 누르면 그날 결제될 구독을 볼 수 있어요.</div>';
      return;
    }
    var dayOcc = map[selectedDay.getDate()] || [];
    var label = MONTH_NAMES[selectedDay.getMonth()] + ' ' + selectedDay.getDate() + '일';
    els.calDetailLabel.innerHTML = '<span>' + label + '</span><span>' + (dayOcc.length ? dayOcc.length + '건' : '') + '</span>';
    if (!dayOcc.length){
      els.calDetailList.innerHTML = '<div class="cal-detail-hint">이 날 결제되는 구독이 없어요.</div>';
      return;
    }
    dayOcc.forEach(function(s){
      els.calDetailList.appendChild(buildRow(s, today, selectedDay));
    });
  }

  els.calPrev.addEventListener('click', function(){
    calDate.setMonth(calDate.getMonth()-1);
    renderCalendar();
  });
  els.calNext.addEventListener('click', function(){
    calDate.setMonth(calDate.getMonth()+1);
    renderCalendar();
  });

  // ---- card strip: mouse drag-to-slide + active dot tracking ----
  (function(){
    var strip = els.cardStrip;
    var dragging = false, startX = 0, startScroll = 0;

    strip.addEventListener('pointerdown', function(e){
      if (e.pointerType !== 'mouse') return;
      dragging = true;
      startX = e.clientX;
      startScroll = strip.scrollLeft;
      strip.classList.add('dragging');
      strip.setPointerCapture(e.pointerId);
    });
    strip.addEventListener('pointermove', function(e){
      if (!dragging) return;
      strip.scrollLeft = startScroll - (e.clientX - startX);
    });
    function endDrag(){
      dragging = false;
      strip.classList.remove('dragging');
    }
    strip.addEventListener('pointerup', endDrag);
    strip.addEventListener('pointercancel', endDrag);

    var raf = null;
    function updateActiveDot(){
      var chips = strip.children;
      if (!chips.length || !els.cardDots.children.length) return;
      var contRect = strip.getBoundingClientRect();
      var contCenter = contRect.left + contRect.width / 2;
      var closestIdx = 0, closestDist = Infinity;
      Array.prototype.forEach.call(chips, function(chip, i){
        var r = chip.getBoundingClientRect();
        var dist = Math.abs((r.left + r.width / 2) - contCenter);
        if (dist < closestDist){ closestDist = dist; closestIdx = i; }
      });
      Array.prototype.forEach.call(els.cardDots.children, function(dot, i){
        dot.classList.toggle('active', i === closestIdx);
      });
    }
    strip.addEventListener('scroll', function(){
      if (raf) return;
      raf = requestAnimationFrame(function(){ updateActiveDot(); raf = null; });
    });
  })();

  els.viewSwitch.addEventListener('click', function(e){
    var btn = e.target.closest('.view-btn');
    if (!btn) return;
    var view = btn.getAttribute('data-view');
    Array.prototype.forEach.call(els.viewSwitch.children, function(b){ b.classList.toggle('active', b===btn); });
    els.listView.hidden = view !== 'list';
    els.calendarView.hidden = view !== 'calendar';
  });

  els.themeToggle.addEventListener('click', function(){
    var root = document.documentElement;
    var cur = root.getAttribute('data-theme');
    if (cur === 'dark'){ root.setAttribute('data-theme','light'); }
    else if (cur === 'light'){ root.removeAttribute('data-theme'); }
    else { root.setAttribute('data-theme','dark'); }
  });

  function showLoadError(){
    els.totalCaption.className = 'total-caption error';
    els.totalCaption.textContent = 'data.js를 읽지 못했어요. 쉼표나 따옴표가 빠진 곳이 없는지 확인해 주세요.';
  }

  // Timestamp query keeps the browser from serving a stale cached data.js after an edit.
  var script = document.createElement('script');
  script.src = 'data.js?t=' + Date.now();
  script.onload = function(){
    if (!Array.isArray(window.SUBSCRIPTIONS)){ showLoadError(); return; }
    subs = normalize(window.SUBSCRIPTIONS);
    render();
  };
  script.onerror = showLoadError;
  document.body.appendChild(script);
})();
</script>
</body>
</html>
